<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Compare Brazilian CLT, domestic PJ and international PJ take-home pay with year-based tax tables."
    />
    <title>Brazil Net Pay Comparator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('bnp-theme')
        if (t === 'light' || t === 'black') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}

      // GitHub Pages serves this source index from main. Load the built bundle.
      // (Plain script so Vite does not treat it as the app entry.)
      if (location.hostname.endsWith('github.io')) {
        var css = document.createElement('link')
        css.rel = 'stylesheet'
        css.href = '/BrazilNetPayComparator/assets/app.css'
        document.head.appendChild(css)
        window.__BNP_PAGES__ = true
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.__BNP_PAGES__) {
        var js = document.createElement('script')
        js.type = 'module'
        js.src = '/BrazilNetPayComparator/assets/app.js'
        document.body.appendChild(js)
      }
    </script>
    <!-- Vite entry (local dev + production build). Ignored on Pages when app.js loads above. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
