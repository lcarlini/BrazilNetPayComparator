name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll

      # Keep production bundle on main so Pages (branch=main) works with a single index.html
      - name: Sync production assets onto main
        run: |
          mkdir -p assets
          cp -f dist/assets/app.js assets/app.js
          cp -f dist/assets/app.css assets/app.css
          cp -f dist/favicon.svg public/favicon.svg || true
          touch .nojekyll

      - name: Commit production assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync production assets for GitHub Pages'
          file_pattern: 'assets/app.js assets/app.css .nojekyll public/favicon.svg'

      - name: Deploy build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Point Pages source to gh-pages (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          curl -s -o /tmp/pages-out.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$BODY" || true
          cat /tmp/pages-out.json || true
