name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll

      - name: Deploy build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # Point GitHub Pages at gh-pages so main's Vite source index is never published.
      - name: Point Pages source to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -s -o /tmp/pages-out.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$BODY")
          echo "PUT /pages => $CODE"
          cat /tmp/pages-out.json || true
          if [ "$CODE" = "404" ]; then
            CODE=$(curl -s -o /tmp/pages-out.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d "$BODY")
            echo "POST /pages => $CODE"
            cat /tmp/pages-out.json || true
          fi
          # 200/201/204 = ok; 409 may mean already configured — still fine
          case "$CODE" in
            200|201|204|409) exit 0 ;;
            *) echo "Could not auto-set Pages source (HTTP $CODE). Set Settings → Pages → Branch: gh-pages manually."; exit 0 ;;
          esac
